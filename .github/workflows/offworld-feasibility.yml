name: Liquid Wave Neon Tides release candidate
on:
  push:
    branches: [liquid-wave-offworld-development]
    paths: ['native/**', 'src/**', 'tests/offworld-mode.txt', '.github/workflows/offworld-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: offworld-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned FM1 Base and its board support
        run: |
          git clone https://github.com/charlesvestal/fm1-base.git "$RUNNER_TEMP/fm1-base"
          git -C "$RUNNER_TEMP/fm1-base" checkout 6d6ae6d874fb34e2bec3fc6043fa7d859b206462
          git -C "$RUNNER_TEMP/fm1-base" submodule update --init --recursive
      - name: Fetch and prepare pinned FM1 Radio modules
        run: |
          git clone https://github.com/charlesvestal/fm1-radio.git "$RUNNER_TEMP/fm1-radio"
          git -C "$RUNNER_TEMP/fm1-radio" checkout 494c2a655f4cf3bd5130886133b6ab67103c6bf9
          python3 native/prepare-radio.py "$RUNNER_TEMP/fm1-radio"
      - name: Fetch exact OFFWORLD source and prepare full DSP
        run: |
          git clone https://github.com/swtdr34mz-afk/OFFWORLD.git "$RUNNER_TEMP/offworld"
          git -C "$RUNNER_TEMP/offworld" checkout 4558b995c376d65fa885947ac2995cc53cac206d
          python3 native/prepare-offworld.py "$RUNNER_TEMP/offworld"
      - name: Install host build dependencies
        run: python3 -m pip install --break-system-packages Pillow
      - name: Generate full original Tidbit sprite for native Weather Room
        run: python3 tools/generate_tidbit_room.py
      - name: Pack exact original font without visual changes
        run: python3 tools/pack_native_font.py
      - name: Compile native host simulator
        run: python3 "$RUNNER_TEMP/fm1-base/tools/build.py" "$GITHUB_WORKSPACE/native" --host
      - name: Check native simulator audio and project saves
        run: |
          mkdir -p "$RUNNER_TEMP/liquid-wave-smoke"
          native/build/host/liquid-wave-offworld_host tests/native-wifi-smoke.txt "$RUNNER_TEMP/liquid-wave-smoke"
      - name: Test actual OFFWORLD notes and screen transition
        run: |
          mkdir -p "$RUNNER_TEMP/offworld-smoke"
          native/build/host/liquid-wave-offworld_host tests/offworld-mode.txt "$RUNNER_TEMP/offworld-smoke"
      - name: Regression tests for all original screens and Wi-Fi lifecycle
        run: |
          mkdir -p "$RUNNER_TEMP/regression"
          native/build/host/liquid-wave-offworld_host tests/native-wifi-audit.txt "$RUNNER_TEMP/regression"
      - name: Radio audio fixture and lifecycle regression
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:sample_rate=44100 -t 4 -ac 2 -b:a 128k -write_xing 0 -id3v2_version 0 "$RUNNER_TEMP/radio-fixture.mp3"
          LW_RADIO_FIXTURE="$RUNNER_TEMP/radio-fixture.mp3" native/build/host/liquid-wave-offworld_host tests/native-radio-audit.txt "$RUNNER_TEMP/regression"
      - name: Check pinned flash driver chip recognition
        run: |
          cc -std=c99 -Wall -Wextra -Werror "$RUNNER_TEMP/fm1-base/tests/flash_ok_test.c" -o "$RUNNER_TEMP/flash-ok-test"
          "$RUNNER_TEMP/flash-ok-test"
          (cd "$RUNNER_TEMP/fm1-base" && python3 tests/install_test.py)
      - name: Fetch pi32v2 toolchain and AC79 SDK
        run: |
          sh "$RUNNER_TEMP/fm1-base/tools/get_toolchain.sh"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Compile device image and enforce linker and hardware safety limits
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: |
          # Measure compact device code generation for all integration units.
          # Physical render deadlines remain a separate required test.
          python3 - "$RUNNER_TEMP/fm1-base/tools/build.py" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          a='units.append(("cc", *o2, *o2_more, *inc(f.parent), *ir_out, "-c", f, "-o", o.with_suffix(".ll") if ir else o))'
          b='unit_flags = [("-Oz" if v == "-O2" else v) for v in o2]\n            units.append(("cc", *unit_flags, *o2_more, *inc(f.parent), *ir_out, "-c", f, "-o", o.with_suffix(".ll") if ir else o))'
          assert s.count(a)==1
          s=s.replace(a,b)
          s=s.replace('("cc", *flags, *ir_out, "-c", SRC / "device" / "unity.c"', '("cc", *[("-Oz" if v=="-Os" else v) for v in flags], *ir_out, "-c", SRC / "device" / "unity.c"')
          s=s.replace('"--gc-sections", "-e", "_start", "-T", ld,','"--gc-sections", "-Map", str(OUT / "device-link.map"), "-e", "_start", "-T", ld,')
          p.write_text(s)
          PY
          python3 "$RUNNER_TEMP/fm1-base/tools/build.py" "$GITHUB_WORKSPACE/native"
          test -s native/build/liquid-wave-offworld.fwsc
      - name: Assemble and verify separate USB test installer
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,zipfile
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'fm1-base'
          out=pathlib.Path('neon-candidate');out.mkdir()
          raw=pathlib.Path('native/build/liquid-wave-offworld.fwsc').read_bytes()
          product=''.join(chr((raw[i*48+47]-i-1)&255) for i in range(20) if raw[i*48+47]!=125)
          assert len(raw)==611496 and product=='FM-1_9700' and b'FELUCCA-LOADER-1' in raw
          hdr=pathlib.Path('native/app.h').read_text()
          offsets=[int(v,16) for v in re.findall(r'0x([0-9a-fA-F]+)u',re.search(r'APP_STORE_MAP\s*\{([^}]+)\}',hdr)[1])]
          assert len(offsets)==6 and all(n%4096==0 and 0x97000<=n and n+8192<=0xe0000 for n in offsets)
          assert all(abs(a-b)>=8192 for i,a in enumerate(offsets) for b in offsets[i+1:])
          digest=hashlib.sha256(raw).hexdigest()
          (out/'firmware.fwsc').write_bytes(raw)
          def strip(s):
              return re.sub(r'^import .*?;\n','',re.sub(r'^export\s+','',s,flags=re.M),flags=re.M)
          lib='\n'.join(strip((base/'web'/n).read_text()) for n in ('fm1pkg.js','fm1ota.js'))
          old='/fm-?1|felucca|ota|composite|sinco|usb-midi/i'
          assert old in lib
          lib=lib.replace(old,'/fm-?1|felucca|ota|composite|sinco|usb-midi|liquid[ -]?wave/i')
          html=(base/'web/installer.html').read_text()
          check='if (productOf(pkg) !== meta.product) { sayK("badpkg"); return; }'
          assert html.count(check)==1
          html=html.replace(check,'''const hash = await crypto.subtle.digest("SHA-256", pkg);
              const hex = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,"0")).join("");
              if (hex !== meta.sha256 || productOf(pkg) !== meta.product) { sayK("badpkg"); return; }''')
          meta={'version':'Neon Tides — hardware-test candidate','product':product,'pkg':'firmware.fwsc','sha256':digest,'backup':False,'boot':None}
          assert html.count('/*LIB*/')==html.count('/*META*/')==1
          html=html.replace('/*LIB*/',lib).replace('/*META*/',json.dumps(meta))
          for k,v in {'NAME':'Advanced Liquid Wave — Neon Tides','REPO':'https://github.com/patrickchristianandrews/foma','REPO_SHORT':'github.com/patrickchristianandrews/foma','LICENSE':'GPL-3.0 / MPL-2.0 components','CREDITS':'See repository source and license notices.'}.items():
              html=html.replace('{{'+k+'}}',v)
          assert not re.search(r'\{\{[A-Z_]+\}\}',html)
          html=re.sub(r'(<body[^>]*>)',r'\1<p style="padding:12px;border:2px solid #b77836"><strong>Hardware-test candidate only.</strong> Automated tests passed; physical installation, real-time audio and recovery are unverified. Back up your device first; use a spare test unit only. Do not disconnect USB during a write. No bootloader update. The existing installer remains available. <a href="/liquid-wave/">Back to Liquid Wave</a></p>',html,count=1)
          assert 'id="go"' in html and digest in html
          (out/'index.html').write_text(html)
          (out/'release.json').write_text(json.dumps({'revision':os.environ['GITHUB_SHA'],'product':product,'firmware_sha256':digest,'device_run':os.environ['GITHUB_RUN_ID'],'hardware_tested':False},indent=2))
          (out/'LICENSE-DSP.txt').write_bytes(pathlib.Path('native/offworld/LICENSE').read_bytes())
          with zipfile.ZipFile('Advanced-Liquid-Wave-Neon-Tides-test-installer.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(out.iterdir()):z.write(f,f.name)
          print('Neon Tides SHA256:',digest)
          PY
      - name: Retain exact verified test candidate
        uses: actions/upload-artifact@v4
        with:
          name: liquid-wave-neon-tides-test-candidate
          path: Advanced-Liquid-Wave-Neon-Tides-test-installer.zip
          if-no-files-found: error
      - name: Preserve build diagnostics only (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offworld-feasibility-diagnostics
          path: |
            native/build/**/*.map
            native/build/**/*.txt
          if-no-files-found: warn
