name: Pocket Wave firmware
on:
  push:
    branches: [main]
    paths: ['src/**', 'firmware.json', 'tools/package_pocket_wave.py', 'tools/package_dx7.py', '.github/workflows/pocket-wave.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build device and emulator
        run: docker run --rm --platform linux/amd64 -v "$PWD:/work" konsumer/foma-toolchain python3 tools/build.py
      - name: Package installer-first release
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          python3 tools/package_pocket_wave.py
      - name: Fetch and bundle all 26 external DX7 banks
        run: python3 tools/package_dx7.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Wave-complete
          path: build/Pocket-Wave-complete.zip
          if-no-files-found: error
